name: Autonomous Zoom Meeting Recorder

on:
  workflow_dispatch:
    inputs:
      meeting_url:
        description: 'Zoom Meeting Link or ID'
        required: true
        type: string
      passcode:
        description: 'Meeting Passcode (leave blank if in link)'
        required: false
        type: string
        default: ''
      display_name:
        description: 'Participant Display Name'
        required: false
        type: string
        default: 'Student'
      duration_minutes:
        description: 'Max Recording Duration (minutes)'
        required: false
        type: string
        default: '90'

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install System Audio & Video Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pulseaudio xvfb x11-utils dbus-x11 curl jq

      - name: Install Backend Node Dependencies
        working-directory: backend
        run: |
          npm install

      - name: Install Playwright Chromium
        working-directory: backend
        run: |
          npx playwright install --with-deps chromium

      - name: Setup Virtual PulseAudio & Display
        run: |
          # Start Virtual X11 Display
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99

          # Start PulseAudio for digital sound
          pulseaudio -D --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=virtual_speaker || true
          pactl set-default-sink virtual_speaker || true

      - name: Start Zoom Bot Server & Launch Recording
        working-directory: backend
        env:
          DISPLAY: :99
          PULSE_SERVER: unix:/run/user/1001/pulse/native
          MEETING_URL: ${{ github.event.inputs.meeting_url }}
          PASSCODE: ${{ github.event.inputs.passcode }}
          DISPLAY_NAME: ${{ github.event.inputs.display_name }}
          RECORD_DURATION: ${{ github.event.inputs.duration_minutes }}
          PERSIST_DIR: ${{ github.workspace }}/backend
        run: |
          # 1. Start backend server in background with logging
          node src/index.js > server.log 2>&1 &
          SERVER_PID=$!
          echo "Server started with PID $SERVER_PID. Waiting for it to be ready..."

          for i in $(seq 1 30); do
            if curl -sf http://localhost:3000/api/health > /dev/null 2>&1; then
              echo "✅ Zoom Bot Server is up and healthy!"
              break
            fi
            sleep 1
          done

          if ! curl -sf http://localhost:3000/api/health; then
            echo "❌ Health check failed. Server output:"
            cat server.log
            exit 1
          fi

          # 2. Trigger meeting recording via API with safe JSON payload
          echo "Triggering recording for $MEETING_URL with name '$DISPLAY_NAME'..."
          PAYLOAD=$(jq -n \
            --arg url "$MEETING_URL" \
            --arg pwd "$PASSCODE" \
            --arg name "$DISPLAY_NAME" \
            '{meetingUrl: $url, passcode: $pwd, displayName: $name}')

          RESPONSE=$(curl -s -X POST http://localhost:3000/api/bot/record \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")

          echo "Response: $RESPONSE"
          BOT_ID=$(echo "$RESPONSE" | jq -r '.meetingId // empty')
          echo "Active Bot ID: $BOT_ID"

          if [ -z "$BOT_ID" ] || [ "$BOT_ID" == "null" ]; then
            echo "❌ Error: Failed to launch bot. Response was:"
            echo "$RESPONSE"
            cat server.log
            exit 1
          fi

          # 3. Wait for specified recording duration (convert minutes to seconds)
          DURATION_SECS=$((RECORD_DURATION * 60))
          echo "🎥 Recording active in cloud... Waiting for $DURATION_SECS seconds ($RECORD_DURATION minutes)..."

          # Monitor loop checking if bot is still alive and capturing audio
          ELAPSED=0
          while [ $ELAPSED -lt $DURATION_SECS ]; do
            sleep 15
            ELAPSED=$((ELAPSED + 15))

            STATUS_RESP=$(curl -s "http://localhost:3000/api/live/status" || echo "{}")
            IS_ACTIVE=$(echo "$STATUS_RESP" | jq -r '.active // false')
            CURR_STATUS=$(echo "$STATUS_RESP" | jq -r '.status // "UNKNOWN"')
            AUDIO_BYTES=$(echo "$STATUS_RESP" | jq -r '.audioBytes // 0')

            if [ "$IS_ACTIVE" == "false" ] && [ $ELAPSED -gt 120 ]; then
              echo "Meeting ended by host or bot finished at $ELAPSED seconds."
              break
            fi

            if [ $((ELAPSED % 60)) -eq 0 ]; then
              echo "Recorded $((ELAPSED / 60)) / $RECORD_DURATION mins | Status: $CURR_STATUS | Audio: $AUDIO_BYTES bytes"
            fi
          done

          # 4. Stop bot gracefully and synchronously finalize MP4 with digital audio
          echo "Stopping bot and finalizing MP4 with digital audio..."
          STOP_RESP=$(curl -s -X POST http://localhost:3000/api/bot/stop \
            -H "Content-Type: application/json" \
            -d "{\"botId\":\"$BOT_ID\",\"sync\":true}" || true)
          echo "Stop Response: $STOP_RESP"

          # Verify final MP4 artifact exists on disk
          echo "Verifying MP4 file on disk..."
          for i in $(seq 1 30); do
            MP4_COUNT=$(find recordings/ -name "*.mp4" -size +10k 2>/dev/null | wc -l)
            if [ "$MP4_COUNT" -gt 0 ]; then
              echo "✅ Confirmed MP4 recording ready on disk:"
              ls -lh recordings/*.mp4
              break
            fi
            sleep 2
          done
          echo "Finished recording session."

      - name: Upload Meeting Recording MP4 to GitHub
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zoom-meeting-recording
          path: backend/recordings/*.mp4
          retention-days: 7
