name: Autonomous Zoom Meeting Recorder

on:
  workflow_dispatch:
    inputs:
      meeting_url:
        description: 'Zoom Meeting Link or ID'
        required: true
        type: string
      passcode:
        description: 'Meeting Passcode (leave blank if in link)'
        required: false
        type: string
        default: ''
      display_name:
        description: 'Participant Display Name'
        required: false
        type: string
        default: 'Student'
      duration_minutes:
        description: 'Max Recording Duration (minutes)'
        required: false
        type: string
        default: '90'

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: backend/package.json

      - name: Install System Audio & Video Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg pulseaudio xvfb x11-utils dbus-x11 curl jq

      - name: Install Backend Node Dependencies
        working-directory: backend
        run: |
          npm install

      - name: Install Playwright Chromium
        working-directory: backend
        run: |
          npx playwright install --with-deps chromium

      - name: Setup Virtual PulseAudio & Display
        run: |
          # Start Virtual X11 Display
          Xvfb :99 -screen 0 1920x1080x24 &
          export DISPLAY=:99

          # Start PulseAudio for digital sound
          pulseaudio -D --exit-idle-time=-1 || true
          pactl load-module module-null-sink sink_name=virtual_speaker || true
          pactl set-default-sink virtual_speaker || true

      - name: Start Zoom Bot Server & Launch Recording
        working-directory: backend
        env:
          DISPLAY: :99
          PULSE_SERVER: unix:/run/user/1001/pulse/native
          MEETING_URL: ${{ github.event.inputs.meeting_url }}
          PASSCODE: ${{ github.event.inputs.passcode }}
          DISPLAY_NAME: ${{ github.event.inputs.display_name }}
          RECORD_DURATION: ${{ github.event.inputs.duration_minutes }}
          PERSIST_DIR: ${{ github.workspace }}/backend
        run: |
          # 1. Start backend server in background
          node src/index.js &
          SERVER_PID=$!
          echo "Server started with PID $SERVER_PID, waiting for it to be ready..."
          sleep 4

          # 2. Check health
          curl -sf http://localhost:3000/api/health || (echo "Health check failed" && exit 1)

          # 3. Trigger meeting recording via API
          echo "Triggering recording for $MEETING_URL with name '$DISPLAY_NAME'..."
          RESPONSE=$(curl -s -X POST http://localhost:3000/api/bot/record \
            -H "Content-Type: application/json" \
            -d "{\"meetingUrl\":\"$MEETING_URL\",\"passcode\":\"$PASSCODE\",\"displayName\":\"$DISPLAY_NAME\"}")

          echo "Response: $RESPONSE"
          BOT_ID=$(echo "$RESPONSE" | jq -r '.meetingId')
          echo "Active Bot ID: $BOT_ID"

          if [ "$BOT_ID" == "null" ] || [ -z "$BOT_ID" ]; then
            echo "Error: Failed to launch bot"
            exit 1
          fi

          # 4. Wait for specified recording duration (convert minutes to seconds)
          DURATION_SECS=$((RECORD_DURATION * 60))
          echo "Recording active in cloud... Waiting for $DURATION_SECS seconds ($RECORD_DURATION minutes)..."

          # Monitor loop checking if bot is still alive
          ELAPSED=0
          while [ $ELAPSED -lt $DURATION_SECS ]; do
            sleep 15
            ELAPSED=$((ELAPSED + 15))
            
            STATUS_RESP=$(curl -s "http://localhost:3000/api/live/status" || echo "{}")
            IS_ACTIVE=$(echo "$STATUS_RESP" | jq -r '.active // false')
            
            if [ "$IS_ACTIVE" == "false" ] && [ $ELAPSED -gt 120 ]; then
              echo "Meeting ended by host or bot finished early at $ELAPSED seconds."
              break
            fi

            if [ $((ELAPSED % 60)) -eq 0 ]; then
              echo "Recorded $((ELAPSED / 60)) / $RECORD_DURATION minutes..."
            fi
          done

          # 5. Stop bot gracefully to finalize video and audio muxing
          echo "Stopping bot and finalizing MP4 with digital audio..."
          curl -s -X POST http://localhost:3000/api/bot/stop \
            -H "Content-Type: application/json" \
            -d "{\"botId\":\"$BOT_ID\"}" || true

          sleep 5
          echo "Finished recording session."

      - name: Upload Meeting Recording MP4 to GitHub
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zoom-meeting-recording
          path: backend/recordings/*.mp4
          retention-days: 7
