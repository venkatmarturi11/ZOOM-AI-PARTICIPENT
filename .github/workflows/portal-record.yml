name: Portal meeting recorder

on:
  workflow_dispatch:
  schedule:
    # ── CRON IS IN UTC ──
    # IST is UTC+5:30 (triggers 5 min before each class)
    # 1. Advance Java at 6:00 PM IST (18:00) -> 17:55 IST = 12:25 UTC
    - cron: "25 12 * * *"
    # 2. React JS at 7:30 PM IST (19:30)    -> 19:25 IST = 13:55 UTC
    - cron: "55 13 * * *"

concurrency:
  group: portal-recorder-${{ github.event.schedule || github.run_id }}   # each class gets its own parallel job
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 345        # just under the 6-hour GitHub Actions limit

    env:
      PORTAL_URL:        ${{ secrets.PORTAL_URL }}
      PORTAL_USER:       ${{ secrets.PORTAL_USER }}
      PORTAL_PASS:       ${{ secrets.PORTAL_PASS }}
      PORTAL_TZ:         "Asia/Kolkata"
      CARD_SELECTOR:     "/html/body/div/div/div[1]/div[4]/div"
      DISPLAY_NAME:      "Recorder"
      WAIT_MINUTES:      "20"
      MAX_MINUTES:       "120"
      TELEGRAM_API_ID:   ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      TELEGRAM_SESSION:  ${{ secrets.TELEGRAM_SESSION }}
      TELEGRAM_TARGET:   ${{ secrets.TELEGRAM_TARGET }}
      DISPLAY:           ":99"
      PULSE_SINK:        "virtual"

    steps:
      - name: Checkout
        id: checkout
        uses: actions/checkout@v4

      - name: Set up Python (with pip cache)
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Cache apt packages (ffmpeg, xvfb, pulseaudio)
        uses: awalsh128/cache-apt-pkgs-action@v1
        with:
          packages: ffmpeg xvfb pulseaudio
          version: "1.0"

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Cache Playwright browser
        id: pw-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install Chromium
        id: install
        run: |
          if [ "${{ steps.pw-cache.outputs.cache-hit }}" = "true" ]; then
            playwright install-deps chromium      # browser cached, only system libs needed
          else
            playwright install --with-deps chromium
          fi

      - name: Start virtual display and audio
        run: |
          # Xvfb virtual framebuffer (1280×720, 24-bit colour)
          Xvfb :99 -screen 0 1280x720x24 &

          # PulseAudio in no-exit-idle mode
          pulseaudio --start --exit-idle-time=-1 --daemonize=yes || true
          sleep 1

          # Virtual null sink — only browser audio is captured
          pactl load-module module-null-sink sink_name=virtual sink_properties=device.description=Virtual
          pactl set-default-sink virtual
          sleep 1

          # Verify setup
          pactl list short sinks
          echo "Audio + display ready"

      - name: Find live meeting, join, and record
        id: record
        run: python portal_recorder.py

      - name: Upload to Telegram
        # Run whenever dependencies are present — script decides what to send
        if: ${{ always() && steps.install.outcome == 'success' }}
        run: python send_telegram.py

      - name: Upload debug screenshots
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-screenshots
          path: recordings/debug_*.png
          if-no-files-found: ignore
          retention-days: 7
