name: Keep Render Alive

on:
  schedule:
    # Ping every 14 minutes to prevent Render free tier from sleeping
    - cron: '*/14 * * * *'
  workflow_dispatch: # Allow manual trigger

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Health Endpoint
        run: |
          curl -sf https://zoom-ai-participent.onrender.com/api/health || echo "Server is waking up..."
          sleep 5
          curl -sf https://zoom-ai-participent.onrender.com/api/health || echo "Health check retry..."
